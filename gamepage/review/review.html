<div id="reviewOverlay" class="review-overlay hidden" aria-hidden="true">
    <div class="review-backdrop"></div>

    <div class="review-modal" role="dialog" aria-modal="true" aria-labelledby="reviewModalTitle">
        <div class="review-header">
            <h2 id="reviewModalTitle">Write a Review</h2>
            <button id="closeReview" class="review-close" type="button" aria-label="Close review modal">✕</button>
        </div>

        <div class="review-description">
            <div class="review-item" id="reviewMetaGenre">Genre: —</div>
            <div class="review-item" id="reviewMetaPublisher">Publisher: —</div>
            <div class="review-item" id="reviewMetaRelease">Release Date: —</div>
        </div>

        <div class="review-content">
            <div class="content-top">
                <div class="review-toolbar">
                    <button id="btnBold" type="button" aria-label="Bold"><strong>B</strong></button>
                    <button id="btnItalic" type="button" aria-label="Italic"><em>I</em></button>
                    <button id="btnUnderline" type="button" aria-label="Underline"><u>U</u></button>
                </div>

                <div class="content-dropdown-wrapper">
                    <div class="review-char-counter" id="reviewCharCounter">0 / 3000</div>

                    <button id="btnReset" class="reset-btn" type="button" title="Reset review">
                        <i class="fa fa-refresh" aria-hidden="true"></i>
                    </button>

                    <div class="review-dropdown" id="reviewDropdown">
                        <button class="review-dropdown-btn" id="reviewRecommendationBtn" type="button">
                            Recommendation
                        </button>

                        <div class="review-dropdown-menu">
                            <div class="review-dropdown-item recommended" data-value="recommended">Recommended</div>
                            <div class="review-dropdown-item mixed" data-value="mixed">Mixed Feelings</div>
                            <div class="review-dropdown-item not" data-value="not">Not Recommended</div>
                        </div>
                    </div>
                </div>
            </div>

            <div
                id="editor"
                contenteditable="true"
                class="editor"
                data-placeholder="Write your review here..."
            ></div>
        </div>

        <div class="review-footer">
            <button id="submitReview" class="review-submit" type="button">Submit</button>
        </div>
    </div>
</div>
