<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Review Popup</title>
    <link rel="stylesheet" href="review.css">
</head>
<body>

<button class="btn-secondary" id="btnReview">Write Review</button>

<div id="reviewOverlay" class="review-overlay hidden">
    <div class="review-backdrop"></div>
    <div class="review-modal">
        <div class="review-header">
            <h2>Write a Review for</h2>
            <button id="closeReview" class="review-close">✕</button>
        </div>

        <div class="review-content">
            <div class="review-toolbar">
                <button id="btnBold" type="button" onclick="formatText('bold')">B</button>
                <button id="btnItalic" type="button" onclick="formatText('italic')">I</button>
                <button id="btnUnderline" type="button" onclick="formatText('underline')">U</button>
            </div>
            <div id="editor" contenteditable="true" class="editor"></div>
        </div>

        <div class="review-footer">
            <button id="submitReview" class="review-submit">Submit</button>
        </div>
    </div>
</div>

<script type="module" src="review.js"></script>
</body>
</html>
