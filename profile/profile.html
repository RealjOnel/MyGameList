<!DOCTYPE html>
<html lang="en" data-auth="loading">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function () {
        try {
        const token = localStorage.getItem("token");
        document.documentElement.dataset.auth = token ? "in" : "out";
        } catch (e) {
        document.documentElement.dataset.auth = "out";
        }
    })();
    </script>
    <title>Loading... | MyGameList</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./profile.css">
</head>
<body>

    <div id="navbar-placeholder"></div>

<div class="profile-layout reveal">
    <div class="sidebar">
        <div class="profile_identity">
            <img src="../assets/User/Default_User_Icon.png" alt="User Icon" id="profile_log" class="profile_icon ">
            <h2 class="profile_username">Username</h2>
        </div>
        <div class="profile_socials" id="profileSocialLinks"></div>
        <div class="profile_actionbuttons">
            <div class="profile_actionbuttons">
                <button class="profile_button" onclick="window.location.href='#'">      
                    View Game list
                </button>
                <button class="profile_button" onclick="window.location.href='#'">
                    Send Message
                </button>
                <button class="profile_button" id="friendActionBtn" type="button">Add Friend</button>
            </div>
        </div>

        <div class="profile_bio_section">
            <h3 id="playerDescriptionTitle">Player's Description:</h3>
            <div class="profile_bio_items">
                <div class="profile_bio_content" id="profileBioContent">
                    <div class="muted">No profile details yet.</div>
                </div>
            </div>
        </div>
        
        <div class="profile_friendlist" id="profileFriendsSection">
            <h3>Player's Friends:</h3>
            <div class="profile_friendlist_items" id="profileFriendsList"></div> 
        </div>

        <div class="profile_check_in">
            <h3 id="joinedAt">Joined: -</h3>
            <h3 id="lastOnline">Last Online: -</h3>
        </div>

    </div>
    <div class="profile_main">

        <!-- banner -->
        <div class="profile_banner">
            <img src="../assets/User/banner.png" alt="banner" class="profile_banner_image">
        </div>

        <div class="profile_content">

            <div class="profile_statistics">
                <div class="profile_pie_container">
                    <h3 class="section-title section-title--metal section-title--glow section-title--long profile_block_title">Total Games</h3>
                    <canvas id="pieChart" width="200" height="200"></canvas>
                </div>

                <div class="last_edit" id="profileRecentActivitySection">
                    <h3 class="section-title section-title--metal section-title--glow section-title--long profile_block_title">Recent Activity</h3>
                    <div class="profile_games" id="recentActivityWrap"></div>
                </div>

                <div id="tooltip" class="chart-tooltip"></div>
            </div>

        </div>

        <!-- COMMENT FIELD -->
        <div class="profile_comments" id="profileCommentsSection">
            <h3>Leave a Comment</h3>
            <div class="comment_wrapper">
                <textarea class="comment_input" maxlength="100" placeholder="Write your comment here..."></textarea>
                <button class="comment_button">Post</button>
            </div>

            <div class="comment_meta">
                <span class="comment_counter">0 / 100</span>
            </div>

            <div class="profile_comment_list" id="profileCommentList"></div>
        </div>
    </div>    

    <div class="user_data">
        <div class="profile_right">
            <div class="profile_empty">
                Empty
            </div>
            <div class="profile_favs" id="profileFavoritesSection">
                <div class="profile_favourites">
                    <h3 class="section-title section-title--gradient section-title--glow section-title--long">Favorite Games</h3>
                    <div class="profile_favourites_items" id="profileFavorites"></div>
                </div>
            </div>

            <div class="profile_review" id="profileReviewsSection">
                <h3 class="section-title section-title--gradient section-title--glow section-title--short">Reviews</h3>
                <div class="form_content_class">
                <button class="review_item">
                    <div class="review_card">
                        <div class="review_iconclass">
                            <img src="https://images.igdb.com/igdb/image/upload/t_cover_big/co66n7.jpg" class="review_icon" alt="Grand Theft Auto V: Story Mode">
                        </div>
                        <div class="review_contentclass">

                                </div>
                               <div class="review_likes">
                                    <span class="likes_count">20</span>
                                    <div class="review_likesbtn">
                                        <img class="review_likesicon" src="../assets/User/thumbup.png" alt="ThumbUp">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </button>
                <button class="review_item">
                    <div class="review_card">
                        <div class="review_iconclass">
                            <img src="https://images.igdb.com/igdb/image/upload/t_cover_big/co66n7.jpg" class="review_icon" alt="Grand Theft Auto V: Story Mode">
                        </div>
                        <div class="review_contentclass">
                            <div class="review_top">
                                <h3>GTA</h3>
                                <p> Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. </p>
                            </div>
                            <div class="review_bottom">
                                <div class="review_text">
                                    <p class="review_rating">Rating</p>
                                    <p> 08/03/2026 </p>
                                </div>
                               <div class="review_likes">
                                    <span class="likes_count">20</span>
                                    <div class="review_likesbtn">
                                        <img class="review_likesicon" src="../assets/User/thumbup.png" alt="ThumbUp">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </button>
                </div>
                <button class="show_more_button">
                    Show more
                </button>
            </div>
            <div class="profile_forum">
                <h3 class="section-title section-title--gradient section-title--glow section-title--long"> Forum Posts</h3>
                <div class="form_content_class">
                    <button class="forum_post_item">
                        <div class="forum_post_card">
                            <!-- Game Icon -->
                            <div class="forum_post_iconclass">
                                <img src="https://images.igdb.com/igdb/image/upload/t_cover_big/co66n7.jpg" class="forum_post_icon" alt="Grand Theft Auto V: Story Mode">
                            </div>
                            <div class="forum_post_contentclass">
                                <div class="forum_post_top">
                                    <h3>GTA</h3>

                            </div>
                        </div>

                    <button class="forum_post_item">
                        <div class="forum_post_card">

                            <div class="forum_post_iconclass">
                                <img src="https://images.igdb.com/igdb/image/upload/t_cover_big/co66n7.jpg" class="forum_post_icon" alt="Grand Theft Auto V: Story Mode">
                            </div>
                            <div class="forum_post_contentclass">
                                <div class="forum_post_top">
                                    <h3>GTA</h3>

                            </div>

                    </button>
                </div>
                <button class="show_more_button">
                    Show more
                </button>
            </div>
            
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>

    <script src="/NavFooter/fetchNav.js"></script>
    <script src="/NavFooter/fetchFooter.js"></script>
    <script src="./piechart.js"></script>
    <script src="../js/global/confirmBox.js"></script>
    <script type="module" src="./profile.js"></script>
    <script type="module" src="../js/global/nav-search.js"></script>
    <script src="../js/global/reveal.js"></script>
    <script src="../js/global/active.js"></script>
    <script type="module" src="../js/global/storeuser.js"></script>
    <script type="module" src="./comment.js"></script>
    <script type="module" src="../js/global/friendNotifications.js"></script>
    <script type="module" src="../SettingsLoader/settingsLoader.js"></script>

    <div class="mgl-modal-backdrop" id="mglConfirmModal" hidden>
        <div class="mgl-modal" role="dialog" aria-modal="true" aria-labelledby="mglConfirmTitle">
            <div class="mgl-modal-head">
            <h3 id="mglConfirmTitle">Confirm Action</h3>
            </div>

            <div class="mgl-modal-body">
                <p id="mglConfirmText">Are you sure?</p>
            </div>

            <div class="mgl-modal-actions">
            <button type="button" class="mgl-modal-btn mgl-modal-btn-cancel" id="mglConfirmCancel">
                Cancel
            </button>
            <button type="button" class="mgl-modal-btn mgl-modal-btn-confirm" id="mglConfirmOk">
                Confirm
            </button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
