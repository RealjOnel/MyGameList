<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>MyGameList | Under Construction</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #090b12;
            color: #f5f6fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background:
                radial-gradient(ellipse at 50% 35%, rgb(91 66 190 / 22%), transparent 58%),
                #090b12;
        }

        main {
            width: min(100%, 560px);
            padding: 48px 36px;
            border: 1px solid rgb(255 255 255 / 10%);
            border-radius: 20px;
            background: rgb(17 19 30 / 92%);
            text-align: center;
            box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border: 1px solid rgb(167 139 250 / 35%);
            border-radius: 999px;
            color: #c4b5fd;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        h1 {
            margin: 24px 0 12px;
            font-size: clamp(2rem, 8vw, 3.25rem);
            letter-spacing: -0.05em;
        }

        p {
            margin: 0;
            color: #b7bac8;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .brand {
            margin-top: 32px;
            color: #8b8fa1;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.14em;
        }

        .brand span {
            color: #a78bfa;
        }
    </style>
</head>
<body>
    <main>
        <div class="status">ACCESS DENIED</div>
        <h1>Under construction</h1>
        <p>MyGameList is temporarily unavailable while we carry out maintenance. Please check back later.</p>
        <div class="brand">MY<span>GAMELIST</span></div>
    </main>
</body>
</html>
