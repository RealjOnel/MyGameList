<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGameList | Login</title>
    <link rel="icon" href="/assets/logo/mgllogotabv2.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./login.css">
    <link rel="stylesheet" href="../css/navbar.css">
</head>
<body class="auth-page">

<nav class="navbar navbar--unified">
    <div class="navbar-shell">
        <div class="logo">
            <a href="/index.html">MY<span class="accent">GAMELIST</span></a>
        </div>
    </div>
</nav>

<main class="auth-container">
    <div class="auth-overlay"></div>

    <div class="auth-bg-gallery">
        <div class="gallery-track">
           
        </div>
    </div>

    <div class="auth-deco-line">
        <span class="line-text">SERVER STATUS: AVAILABLE</span>
        <div class="line"></div>
    </div>

    <div class="auth-box glass reveal">
        <div class="auth-header">
            <h2 id="auth-title">Welcome <span class="gradient-text">Back!</span></h2>
            <p id="auth-subtitle">Get back to track your Gaming History.</p>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active" data-type="login" type="button">Login</button>
            <button class="tab-btn" data-type="register" type="button">Register</button>
        </div>
        <p id="error-msg" class="error"></p>
        <form id="auth-form" novalidate>
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" placeholder="Username" required>
            </div>
            
            <div class="input-group" id="email-group" style="display: none;">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input 
                type="password" 
                placeholder="Password" 
                required 
                minlength="8"
                pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}"
                >
            </div>

            <div class="input-group" id="confirm-password-group" style="display: none;">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn-primary auth-submit">
                <span id="submit-text">Login</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <div class="auth-footer">
            <a href="#" class="forgot-link">forgot password?</a>
        </div>
    </div>

</main>

    <script src="../js/global/reveal.js"></script>
    <script src="../js/global/active.js"></script>
    <script type="module" src="./loginregisterswitch.js"></script>  <!--Ist das Notwendig das ist in zeile 113 doch schon da?-->
    <script type="module" src="./gallery.js"></script>
    <script src="./error-msg.js"></script>

    <script type="module" src="../SettingsLoader/settingsLoader.js"></script>
    <script src="../js/global/navbar.js"></script>

</body>
</html>
